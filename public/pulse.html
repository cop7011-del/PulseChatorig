<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-bg"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- AUTH -->
  <main id="authView" class="auth-view">
    <section class="auth-card glass">
      <div class="brand">
        <div class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 2.3 5.7L4 18l.3-2.3A7.9 7.9 0 0 1 4 12Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h5m-5-3h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <div><h1>PulseChat</h1><p>Современный мессенджер с глубокой кастомизацией</p></div>
      </div>
      <div class="segmented" role="tablist">
        <button class="seg active" data-auth="login">Вход</button>
        <button class="seg" data-auth="register">Регистрация</button>
      </div>
      <form id="loginForm" class="stack">
        <label class="field"><span>Логин</span><input name="username" required minlength="3" maxlength="24" autocomplete="username"></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
        <p id="loginError" class="error"></p>
        <button class="btn primary" type="submit">Войти</button>
        <p class="muted small">Демо: <code>alice/password123</code>, <code>bob/password123</code></p>
      </form>
      <form id="registerForm" class="stack hidden">
        <label class="field"><span>Отображаемое имя</span><input name="displayName" required minlength="2" maxlength="40"></label>
        <label class="field"><span>Username</span><input name="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" placeholder="latin_letters_123"></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" required minlength="6"></label>
        <p id="registerError" class="error"></p>
        <button class="btn primary" type="submit">Создать аккаунт</button>
      </form>
    </section>
  </main>

  <!-- APP -->
  <div id="appView" class="app hidden">
    <aside class="sidebar glass">
      <div class="sidebar-top">
        <button id="adminBtn" class="btn ghost hidden" style="width:100%;margin:0 0 10px 0;justify-content:center">🛡️ Админ-панель</button>
        <button id="myProfileBtn" class="me-card">
          <div id="myAvatar" class="avatar"></div>
          <div class="me-meta">
            <div id="myName" class="me-name"></div>
            <div id="myStatus" class="me-status"></div>
          </div>
        </button>
        <div class="sidebar-actions">
          <button id="newChatBtn" class="icon-btn" title="Новый чат"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button id="settingsBtn" class="icon-btn" title="Настройки"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L5.1 11A7 7 0 0 0 5 12c0 .34.03.67.1 1l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.4L18.9 13c.07-.33.1-.66.1-1Z" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="chatSearch" placeholder="Поиск чатов, людей, сообщений...">
      </div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <section class="chat-panel glass">
      <header id="chatHeader" class="chat-header hidden">
        <button id="backBtn" class="icon-btn mobile-only"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button id="chatPeerBtn" class="chat-peer">
          <div id="chatAvatar" class="avatar"></div>
          <div class="chat-peer-meta">
            <div id="chatTitle" class="chat-title"></div>
            <div id="chatSub" class="chat-sub"></div>
          </div>
        </button>
        <div class="chat-actions">
          <button id="audioCallBtn" class="icon-btn" title="Аудиозвонок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 3.16 9.81 19.8 19.8 0 0 1 .09 1.18 2 2 0 0 1 2.06 0h3a2 2 0 0 1 2 1.72c.13 1 .37 1.98.72 2.92a2 2 0 0 1-.45 2.11L6.09 8a16 16 0 0 0 6.91 6.91l1.25-1.24a2 2 0 0 1 2.11-.45c.94.35 1.92.59 2.92.72A2 2 0 0 1 22 16.92Z" stroke="currentColor" stroke-width="1.7"/></svg></button>
          <button id="videoCallBtn" class="icon-btn" title="Видеозвонок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m16 9 6-3v12l-6-3V9Z" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button id="chatMenuBtn" class="icon-btn" title="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/></svg></button>
        </div>
      </header>

      <div id="emptyState" class="empty-state">
        <div class="empty-badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8"/></svg></div>
        <h2>Выберите чат</h2>
        <p>Создайте личный или групповой чат, отправляйте файлы, реакции и голосовые заметки.</p>
      </div>

      <div id="messages" class="messages hidden"></div>
      <div id="typingBar" class="typing-bar hidden"></div>

      <div id="replyBar" class="reply-bar hidden">
        <div class="reply-bar-inner">
          <div class="reply-bar-title">Ответ</div>
          <div id="replyBarText" class="reply-bar-text"></div>
        </div>
        <button id="replyCancel" class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>

      <form id="composer" class="composer hidden">
        <input id="fileInput" type="file" hidden>
        <button id="attachBtn" type="button" class="icon-btn" title="Прикрепить файл"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.07-7.07l8.95-8.95a3.5 3.5 0 0 1 4.95 4.95l-8.95 8.95a2 2 0 1 1-2.83-2.83l8.25-8.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button id="emojiBtn" type="button" class="icon-btn" title="Эмодзи">😊</button>
        <textarea id="messageInput" rows="1" placeholder="Написать сообщение..." maxlength="4000"></textarea>
        <button id="voiceBtn" type="button" class="icon-btn" title="Голосовая заметка"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button id="sendBtn" type="submit" class="send-btn" title="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 20l18-8L3 4v6l12 2-12 2v6Z" fill="currentColor"/></svg></button>
      </form>
      <div id="uploadStatus" class="upload-status hidden"></div>
    </section>
  </div>

  <!-- Modals / panels -->
  <div id="modalRoot"></div>

  <template id="chatItemTpl">
    <button class="chat-item">
      <div class="avatar chat-avatar"></div>
      <div class="chat-item-body">
        <div class="chat-item-top"><span class="chat-item-name"></span><span class="chat-item-time"></span></div>
        <div class="chat-item-bottom"><span class="chat-item-preview"></span><span class="chat-item-meta"></span></div>
      </div>
    </button>
  </template>

  <script src="app.js"></script>
</body>
</html>
